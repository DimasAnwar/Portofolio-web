<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45D1FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Glowing Ambient Circles -->
  <circle cx="250" cy="150" r="180" fill="#45D1FD" opacity="0.12" filter="url(#glow)"/>
  <circle cx="580" cy="350" r="160" fill="#3B82F6" opacity="0.15" filter="url(#glow)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="500" fill="url(#grid)"/>
  </g>

  <!-- Main Smartphone Device Container -->
  <g transform="translate(250, 20)" filter="url(#shadow)">
    <!-- Phone Outer Body Frame -->
    <rect x="0" y="0" width="300" height="460" rx="36" fill="#1E293B" stroke="rgba(69, 209, 253, 0.4)" stroke-width="3"/>
    <!-- Screen Bezel Container -->
    <rect x="8" y="8" width="284" height="444" rx="28" fill="#090D16"/>

    <!-- Screen Content Top Status Bar -->
    <g transform="translate(24, 20)">
      <text x="0" y="10" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">09:41</text>
      <!-- Camera Notch Pill -->
      <rect x="95" y="0" width="60" height="12" rx="6" fill="#000000"/>
      <!-- Battery & Signal Icons -->
      <circle cx="230" cy="6" r="3" fill="#38BDF8"/>
      <rect x="240" y="2" width="14" height="8" rx="2" fill="none" stroke="#94A3B8" stroke-width="1"/>
      <rect x="242" y="4" width="8" height="4" rx="1" fill="#38BDF8"/>
    </g>

    <!-- App Header Bar -->
    <g transform="translate(24, 45)">
      <!-- App Logo Icon -->
      <rect x="0" y="0" width="32" height="32" rx="10" fill="url(#accentGrad)"/>
      <path d="M10 22 L16 10 L22 22 M12 18 L20 18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <text x="42" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">EduSchool</text>
      <text x="42" y="28" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">School Portal v2.0</text>

      <!-- Notification Bell -->
      <circle cx="240" cy="16" r="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <path d="M240 10 C237.5 10 236 12 236 15 L236 18 L234 20 L246 20 L244 18 L244 15 C244 12 242.5 10 240 10 Z" fill="#94A3B8"/>
      <circle cx="244" cy="11" r="3" fill="#EF4444"/>
    </g>

    <!-- Welcome Greeting Card -->
    <g transform="translate(20, 92)">
      <rect x="0" y="0" width="244" height="58" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="14" y="24" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Selamat Pagi, Dimas! 👋</text>
      <text x="14" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">2 Tugas Fisika perlu dikumpulkan hari ini</text>
    </g>

    <!-- Quick Action Grid -->
    <g transform="translate(20, 162)">
      <!-- Item 1: Jadwal -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="54" height="52" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)"/>
        <rect x="19" y="12" width="16" height="16" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
        <line x1="23" y1="16" x2="31" y2="16" stroke="#38BDF8" stroke-width="1.8"/>
        <text x="27" y="42" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">Jadwal</text>
      </g>
      <!-- Item 2: Tugas -->
      <g transform="translate(63,0)">
        <rect x="0" y="0" width="54" height="52" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)"/>
        <circle cx="27" cy="20" r="8" fill="none" stroke="#818CF8" stroke-width="1.8"/>
        <path d="M24 20 L26 22 L30 18" stroke="#818CF8" stroke-width="1.8" fill="none"/>
        <text x="27" y="42" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">Tugas</text>
      </g>
      <!-- Item 3: Nilai -->
      <g transform="translate(126,0)">
        <rect x="0" y="0" width="54" height="52" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)"/>
        <path d="M21 24 L24 17 L27 21 L33 14" stroke="#34D399" stroke-width="1.8" fill="none"/>
        <text x="27" y="42" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">Nilai</text>
      </g>
      <!-- Item 4: Pengumuman -->
      <g transform="translate(189,0)">
        <rect x="0" y="0" width="54" height="52" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)"/>
        <path d="M20 16 L34 16 L31 24 L20 24 Z" stroke="#F472B6" stroke-width="1.8" fill="none"/>
        <text x="27" y="42" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">Info</text>
      </g>
    </g>

    <!-- Course Progress Section Header -->
    <g transform="translate(20, 230)">
      <text x="0" y="0" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Mata Pelajaran Aktif</text>
      <text x="244" y="0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end">Lihat Semua</text>
    </g>

    <!-- Course Card 1: Matematika -->
    <g transform="translate(20, 242)">
      <rect x="0" y="0" width="244" height="52" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
      <rect x="10" y="10" width="32" height="32" rx="8" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="26" y="30" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">∑</text>
      <text x="50" y="24" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Matematika Peminatan</text>
      <text x="50" y="38" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Bab 4: Kalkulus Integral</text>
      <text x="230" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="end">95%</text>
      <!-- Progress Bar -->
      <rect x="170" y="32" width="60" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="170" y="32" width="57" height="4" rx="2" fill="#38BDF8"/>
    </g>

    <!-- Course Card 2: Fisika -->
    <g transform="translate(20, 302)">
      <rect x="0" y="0" width="244" height="52" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
      <rect x="10" y="10" width="32" height="32" rx="8" fill="rgba(129, 140, 248, 0.2)"/>
      <text x="26" y="30" fill="#818CF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">⚛</text>
      <text x="50" y="24" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fisika Modern</text>
      <text x="50" y="38" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Praktikum Gelombang</text>
      <text x="230" y="24" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="end">88%</text>
      <!-- Progress Bar -->
      <rect x="170" y="32" width="60" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="170" y="32" width="52" height="4" rx="2" fill="#818CF8"/>
    </g>

    <!-- Course Card 3: Bahasa Inggris -->
    <g transform="translate(20, 362)">
      <rect x="0" y="0" width="244" height="50" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
      <rect x="10" y="9" width="32" height="32" rx="8" fill="rgba(52, 211, 153, 0.2)"/>
      <text x="26" y="29" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">EN</text>
      <text x="50" y="23" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Bahasa Inggris Lanjutan</text>
      <text x="50" y="37" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Grammar &amp; Essay Writing</text>
      <text x="230" y="23" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="end">92%</text>
      <!-- Progress Bar -->
      <rect x="170" y="31" width="60" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="170" y="31" width="55" height="4" rx="2" fill="#34D399"/>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(8, 416)">
      <rect x="0" y="0" width="284" height="36" fill="#0B0F19" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="45" cy="18" r="4" fill="#38BDF8"/>
      <circle cx="102" cy="18" r="4" fill="#64748B"/>
      <circle cx="159" cy="18" r="4" fill="#64748B"/>
      <circle cx="216" cy="18" r="4" fill="#64748B"/>
      <!-- Active Bar Indicator -->
      <rect x="35" y="30" width="20" height="2" rx="1" fill="#38BDF8"/>
    </g>
  </g>
</svg>
